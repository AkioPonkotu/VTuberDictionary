name: Update dictionary from Twitch

on:
  schedule:
    # Every four hours at :23 UTC, avoiding the start-of-hour schedule peak.
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# The Twitch and agency workflows both update the same versioned state.
concurrency:
  group: dictionary-update
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    environment: dictionary-update
    steps:
      - uses: actions/checkout@v4
        with:
          # A recovery run must be able to find the last commit that changed
          # the artifact, even when this run only checkpoints discovery state.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy src
      - name: Discover Twitch candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_MIN_SUBSCRIBERS: ${{ vars.YOUTUBE_MIN_SUBSCRIBERS || '10000' }}
          TWITCH_MIN_FOLLOWERS: ${{ vars.TWITCH_MIN_FOLLOWERS || '5000' }}
          AUDIENCE_THRESHOLD_MODE: ${{ vars.AUDIENCE_THRESHOLD_MODE || 'any' }}
          REVERIFY_AFTER_DAYS: ${{ vars.REVERIFY_AFTER_DAYS || '180' }}
          TWITCH_DISCOVERY_ENABLED: ${{ vars.TWITCH_DISCOVERY_ENABLED || 'true' }}
          TWITCH_DISCOVERY_LANGUAGE: ${{ vars.TWITCH_DISCOVERY_LANGUAGE || 'ja' }}
          TWITCH_DISCOVERY_TAG: ${{ vars.TWITCH_DISCOVERY_TAG || 'VTuber' }}
          TWITCH_DISCOVERY_MAX_PAGES: ${{ vars.TWITCH_DISCOVERY_MAX_PAGES || '20' }}
        run: uv run vtuber-dictionary discover --source twitch
      - name: Checkpoint discovered candidates before research
        shell: bash
        run: |
          git add -A data
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: checkpoint Twitch discovery"
          git push
      - name: Run safe update pipeline from checkpointed candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_MIN_SUBSCRIBERS: ${{ vars.YOUTUBE_MIN_SUBSCRIBERS || '10000' }}
          TWITCH_MIN_FOLLOWERS: ${{ vars.TWITCH_MIN_FOLLOWERS || '5000' }}
          AUDIENCE_THRESHOLD_MODE: ${{ vars.AUDIENCE_THRESHOLD_MODE || 'any' }}
          REVERIFY_AFTER_DAYS: ${{ vars.REVERIFY_AFTER_DAYS || '180' }}
          TWITCH_DISCOVERY_ENABLED: ${{ vars.TWITCH_DISCOVERY_ENABLED || 'true' }}
          TWITCH_DISCOVERY_LANGUAGE: ${{ vars.TWITCH_DISCOVERY_LANGUAGE || 'ja' }}
          TWITCH_DISCOVERY_TAG: ${{ vars.TWITCH_DISCOVERY_TAG || 'VTuber' }}
          TWITCH_DISCOVERY_MAX_PAGES: ${{ vars.TWITCH_DISCOVERY_MAX_PAGES || '20' }}
        run: uv run vtuber-dictionary process
      - name: Commit changed canonical data and artifact
        id: commit
        shell: bash
        run: |
          git add -A data dist
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update VTuber dictionary from Twitch"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish the latest committed IME dictionary as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact_sha="$(git log -1 --format=%H -- dist/vtuber_dictionary.tsv)"
          test -n "$artifact_sha"
          tag="dictionary-${artifact_sha}"
          asset="$(mktemp)"
          trap 'rm -f "$asset"' EXIT
          git show "${artifact_sha}:dist/vtuber_dictionary.tsv" > "$asset"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --draft \
              --target "$artifact_sha" \
              --title "VTuber IME dictionary ${artifact_sha}" \
              --notes "Automated dictionary update from Twitch live discovery."
          fi
          if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx 'vtuber_dictionary.tsv'; then
            gh release upload "$tag" "${asset}#vtuber_dictionary.tsv"
          fi
          gh release edit "$tag" --draft=false
