name: Update dictionary from Twitch

on:
  schedule:
    # Every four hours at :23 UTC (01:23, 05:23, 09:23, 13:23, 17:23, 21:23 JST).
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# The Twitch and agency workflows both update the same versioned state.
concurrency:
  group: dictionary-update
  # Preserve every discovery checkpoint rather than interrupting an active run.
  cancel-in-progress: false
  queue: max

jobs:
  select-runner:
    # Runner status is checked on a GitHub-hosted VM before the update job is
    # queued. A failed status check deliberately falls back to GitHub-hosted.
    runs-on: ubuntu-latest
    outputs:
      runner_json: ${{ steps.select.outputs.runner_json }}
      runner_kind: ${{ steps.select.outputs.runner_kind }}
    steps:
      - id: select
        name: Prefer the idle local runner when it is available
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        shell: bash
        run: |
          if runners="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runners?name=vtuberdictionary-wsl" \
            2>/dev/null)" \
            && jq -e '
              .runners[]
              | select(
                  .status == "online"
                  and .busy == false
                  and any(.labels[]; .name == "vtuber-local")
                )
            ' >/dev/null <<<"$runners"; then
            echo 'runner_json=["self-hosted","Linux","X64","vtuber-local"]' >> "$GITHUB_OUTPUT"
            echo 'runner_kind=local' >> "$GITHUB_OUTPUT"
          else
            echo 'runner_json=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'runner_kind=github-hosted' >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_json) }}
    # The self-hosted runner allows up to five days. Large Twitch discovery
    # checkpoints can require more than GitHub Actions' six-hour default.
    timeout-minutes: 720
    environment: dictionary-update
    steps:
      - uses: actions/checkout@v4
        with:
          # A recovery run must be able to find the last commit that changed
          # the artifact, even when this run only checkpoints discovery state.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          enable-cache: true
      - name: Verify required workflow configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        shell: bash
        run: |
          for name in OPENAI_API_KEY OPENAI_MODEL TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub Actions configuration::$name is required"
              exit 1
            fi
          done
      - run: uv sync --all-groups --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy src
      - name: Discover Twitch candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_MIN_SUBSCRIBERS: ${{ vars.YOUTUBE_MIN_SUBSCRIBERS || '10000' }}
          TWITCH_MIN_FOLLOWERS: ${{ vars.TWITCH_MIN_FOLLOWERS || '5000' }}
          AUDIENCE_THRESHOLD_MODE: ${{ vars.AUDIENCE_THRESHOLD_MODE || 'any' }}
          PROCESSING_CONCURRENCY: ${{ vars.PROCESSING_CONCURRENCY || '6' }}
          TWITCH_DISCOVERY_ENABLED: ${{ vars.TWITCH_DISCOVERY_ENABLED || 'true' }}
          TWITCH_DISCOVERY_LANGUAGE: ${{ vars.TWITCH_DISCOVERY_LANGUAGE || 'ja' }}
          TWITCH_DISCOVERY_TAG: ${{ vars.TWITCH_DISCOVERY_TAG || 'VTuber' }}
          TWITCH_DISCOVERY_MAX_PAGES: ${{ vars.TWITCH_DISCOVERY_MAX_PAGES || '20' }}
        run: uv run vtuber-dictionary discover --source twitch
      - name: Checkpoint discovered candidates before research
        shell: bash
        run: |
          git add -A data
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: checkpoint Twitch discovery"
          git push
      - name: Run safe update pipeline from checkpointed candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_MIN_SUBSCRIBERS: ${{ vars.YOUTUBE_MIN_SUBSCRIBERS || '10000' }}
          TWITCH_MIN_FOLLOWERS: ${{ vars.TWITCH_MIN_FOLLOWERS || '5000' }}
          AUDIENCE_THRESHOLD_MODE: ${{ vars.AUDIENCE_THRESHOLD_MODE || 'any' }}
          PROCESSING_CONCURRENCY: ${{ vars.PROCESSING_CONCURRENCY || '6' }}
          TWITCH_DISCOVERY_ENABLED: ${{ vars.TWITCH_DISCOVERY_ENABLED || 'true' }}
          TWITCH_DISCOVERY_LANGUAGE: ${{ vars.TWITCH_DISCOVERY_LANGUAGE || 'ja' }}
          TWITCH_DISCOVERY_TAG: ${{ vars.TWITCH_DISCOVERY_TAG || 'VTuber' }}
          TWITCH_DISCOVERY_MAX_PAGES: ${{ vars.TWITCH_DISCOVERY_MAX_PAGES || '20' }}
        run: uv run vtuber-dictionary process --source twitch
      - name: Commit changed canonical data and artifact
        id: commit
        shell: bash
        run: |
          git add -A data dist
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update VTuber dictionary from Twitch"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish the latest committed IME dictionary as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact_sha="$(git log -1 --format=%H -- dist/vtuber_dictionary.tsv dist/vtuber_dictionary_msime.txt dist/vtuber_dictionary_macos.csv)"
          test -n "$artifact_sha"
          tag="dictionary-${artifact_sha}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --draft \
              --target "$artifact_sha" \
              --title "VTuber IME dictionary ${artifact_sha}" \
              --notes "Automated dictionary update from Twitch live discovery."
          fi
          for artifact in vtuber_dictionary.tsv vtuber_dictionary_msime.txt vtuber_dictionary_macos.csv; do
            asset="$(mktemp)"
            git show "${artifact_sha}:dist/${artifact}" > "$asset"
            if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "$artifact"; then
              gh release upload "$tag" "${asset}#${artifact}"
            fi
            rm -f "$asset"
          done
          gh release edit "$tag" --draft=false
